name: Issue 3 auth rate-limit checks
on:
  pull_request:
    paths:
      - "server/**"
      - "package*.json"
      - ".github/workflows/issue-3-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: node --version
      - name: Repair dependency lockfile (security branch only)
        if: github.head_ref == 'security/node-22-23-4-audit'
        run: npm audit fix --package-lock-only --ignore-scripts --audit-level=high
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit audited lockfile (security branch only)
        if: github.head_ref == 'security/node-22-23-4-audit'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh audited npm lockfile"
            git push origin HEAD:security/node-22-23-4-audit
          fi
