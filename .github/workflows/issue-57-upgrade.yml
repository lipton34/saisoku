name: Issue 57 React Router lockfile migration
on:
  pull_request:
    paths:
      - "package.json"
      - ".github/workflows/issue-57-upgrade.yml"
permissions:
  contents: write
jobs:
  upgrade:
    if: github.head_ref == 'security/issue-57-react-router-7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/issue-57-react-router-7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - run: npm install --package-lock-only --ignore-scripts --no-fund
      - run: npm ci --no-fund
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: update React Router 7 lockfile"
            git push origin HEAD:security/issue-57-react-router-7
          fi
