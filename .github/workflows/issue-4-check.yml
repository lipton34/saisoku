name: Issue 4 authentication regression checks
on:
  pull_request:
    paths:
      - "src/**"
      - "server/**"
      - "package*.json"
      - ".github/workflows/issue-4-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
