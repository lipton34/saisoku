name: Prisma 7 isolated PostgreSQL 17 compatibility
on:
  pull_request:
    paths:
      - "prisma/**"
      - "server/prisma.ts"
      - "server/generated/**"
      - "package*.json"
      - "prisma.config.ts"
      - "server/scripts/verifyPrismaCompatibility.ts"
      - ".github/workflows/prisma-7-isolated-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: saisoku_prisma7_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saisoku_prisma7_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/saisoku_prisma7_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/saisoku_prisma7_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      # Supabase API roles are absent in standard Postgres; create role placeholders.
      - name: Prepare Supabase role placeholders
        run: |
          PGPASSWORD=local-test-only psql -h localhost -U postgres -d saisoku_prisma7_test -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN;"
          PGPASSWORD=local-test-only psql -h localhost -U postgres -d saisoku_prisma7_test -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"
      # Legacy migration 20260522085705 references event_notes before the table's
      # creation (20260522090000); a clean migration replay currently fails.
      # Baseline the CURRENT schema in the disposable DB instead, without
      # modifying any historical SQL or writing to production.
      - name: Create schema in disposable DB from current Prisma models
        run: npx prisma db push --skip-generate
      - name: Baseline the 32 historical migrations in disposable DB
        run: |
          for dir in prisma/migrations/*/; do
            [ -f "${dir}migration.sql" ] || continue
            npx prisma migrate resolve --applied "$(basename "$dir")"
          done
      - name: Check baseline migration history against repository
        run: npx prisma migrate status
      - name: Verify Prisma CRUD and transaction
        run: node --import tsx server/scripts/verifyPrismaCompatibility.ts
