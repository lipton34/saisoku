name: Prisma 7 isolated PostgreSQL 17 compatibility
on:
  pull_request:
    paths:
      - "prisma/**"
      - "server/prisma.ts"
      - "server/generated/**"
      - "package*.json"
      - "prisma.config.ts"
      - "server/scripts/verifyPrismaCompatibility.ts"
      - "scripts/bootstrapPrismaIsolatedCI.sh"
      - "docs/prisma-isolated-bootstrap.md"
      - ".github/workflows/prisma-7-isolated-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: saisoku_prisma7_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saisoku_prisma7_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/saisoku_prisma7_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/saisoku_prisma7_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      # Supabase API roles are absent in standard Postgres; create role placeholders.
      - name: Prepare Supabase role placeholders
        run: |
          PGPASSWORD=local-test-only psql -h localhost -U postgres -d saisoku_prisma7_test -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN;"
          PGPASSWORD=local-test-only psql -h localhost -U postgres -d saisoku_prisma7_test -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"
      # Legacy filenames are not replay-safe; bootstrap only this ephemeral CI DB.
      - name: Bootstrap isolated database and verify migration deployment
        run: bash scripts/bootstrapPrismaIsolatedCI.sh
      - name: Verify new migration can be applied after baseline (disposable DB only)
        run: |
          mkdir -p prisma/migrations/20990101000000_ci_future_migration_smoke
          printf '%s\n' 'CREATE TABLE public._ci_future_migration_smoke (id INTEGER PRIMARY KEY);' > prisma/migrations/20990101000000_ci_future_migration_smoke/migration.sql
          npx prisma migrate deploy
          npx prisma migrate status
          PGPASSWORD=local-test-only psql -h localhost -U postgres -d saisoku_prisma7_test -v ON_ERROR_STOP=1 -c "SELECT id FROM public._ci_future_migration_smoke LIMIT 0;"
      - name: Verify Prisma CRUD and transaction
        run: node --import tsx server/scripts/verifyPrismaCompatibility.ts
